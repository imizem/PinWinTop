name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Swift
      uses: swift-actions/setup-swift@v1
      with:
        swift-version: "5.8"

    - name: Build binary
      run: swift build -c release

    - name: Package into App Bundle
      run: |
        mkdir -p PinWinTop.app/Contents/MacOS
        mkdir -p PinWinTop.app/Contents/Resources
        cp .build/release/PinWinTop PinWinTop.app/Contents/MacOS/

        # Create Info.plist
        cat << 'PLIST' > PinWinTop.app/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>PinWinTop</string>
            <key>CFBundleIdentifier</key>
            <string>com.github.PinWinTop</string>
            <key>CFBundleName</key>
            <string>PinWinTop</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        PLIST

        zip -r PinWinTop.app.zip PinWinTop.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: PinWinTop-App
        path: PinWinTop.app.zip

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: PinWinTop.app.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
