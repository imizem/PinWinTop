name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build binary
      run: swift build -c release

    - name: Package into App Bundle
      run: |
        mkdir -p PinWinTop.app/Contents/MacOS
        mkdir -p PinWinTop.app/Contents/Resources

        # Get the actual binary path which varies by architecture (x86_64 vs arm64)
        BIN_PATH=$(swift build -c release --show-bin-path)
        cp "$BIN_PATH/PinWinTop" PinWinTop.app/Contents/MacOS/

        # Create Info.plist
        cat << 'PLIST' > PinWinTop.app/Contents/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>PinWinTop</string>
            <key>CFBundleIdentifier</key>
            <string>com.github.PinWinTop</string>
            <key>CFBundleName</key>
            <string>PinWinTop</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>LSUIElement</key>
            <true/>
            <key>NSHighResolutionCapable</key>
            <true/>
        </dict>
        </plist>
        PLIST

        zip -r PinWinTop.app.zip PinWinTop.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PinWinTop-App
        path: PinWinTop.app.zip

    - name: Release for Tags
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: PinWinTop.app.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release for Manual Dispatch
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'workflow_dispatch'
      with:
        tag_name: latest
        name: Latest Build
        files: PinWinTop.app.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
